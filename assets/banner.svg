<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3b5a"/>
      <stop offset="55%" stop-color="#146c94"/>
      <stop offset="100%" stop-color="#1b8ab0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a1a"/>
      <stop offset="100%" stop-color="#0f1a10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>

  <!-- Subtle block pattern -->
  <g opacity="0.18">
    <rect x="80" y="60" width="90" height="90" fill="#2aa0c1"/>
    <rect x="200" y="40" width="60" height="60" fill="#1d7ea3"/>
    <rect x="1030" y="70" width="80" height="80" fill="#2aa0c1"/>
    <rect x="930" y="30" width="50" height="50" fill="#1d7ea3"/>
    <rect x="520" y="40" width="70" height="70" fill="#1d7ea3"/>
  </g>

  <!-- Mountains -->
  <polygon points="0,260 180,140 360,260" fill="#0f2a3a" opacity="0.8"/>
  <polygon points="260,260 460,120 660,260" fill="#14364c" opacity="0.9"/>
  <polygon points="600,260 800,150 1000,260" fill="#0f2a3a" opacity="0.8"/>
  <polygon points="860,260 1020,170 1200,260" fill="#14364c" opacity="0.9"/>

  <!-- Ground -->
  <rect y="260" width="1200" height="100" fill="url(#ground)"/>

  <!-- Title -->
  <text x="80" y="180" font-size="56" font-family="Trebuchet MS, Verdana, Arial, sans-serif" fill="#f2f8ff">
    StephanMinecraftServer
  </text>
  <text x="80" y="220" font-size="22" font-family="Trebuchet MS, Verdana, Arial, sans-serif" fill="#cfe8f5">
    Survival • Economy • Clans • Guilds • Battlepass • PvP
  </text>
</svg>
